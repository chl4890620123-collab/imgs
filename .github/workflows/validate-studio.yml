name: Validate Saseok Studio

on:
  push:
    paths:
      - "studio/**"
      - ".github/workflows/validate-studio.yml"
  pull_request:
    paths:
      - "studio/**"
      - ".github/workflows/validate-studio.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile studio and Colab worker
        run: |
          python -m py_compile studio/*.py
          python -m py_compile colab/*.py
      - name: Core tests
        env:
          PYTHONPATH: studio
        run: |
          python studio/test_core.py
          python studio/test_remote_jobs.py
      - name: Colab worker lifecycle test
        env:
          PYTHONPATH: studio:colab
        run: python colab/test_drive_worker.py
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Real render integration test
        env:
          PYTHONPATH: studio
        run: |
          python studio/test_render_integration.py
          python studio/test_shortform_render_integration.py
      - name: MCP server import smoke test
        run: |
          python -m pip install "mcp>=2,<3"
          PYTHONPATH=studio python -c "import mcp_server; print(mcp_server.mcp.name)"
